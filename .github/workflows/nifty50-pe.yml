name: Fetch & Upsert Nifty 50 P/E

on:
  schedule:
    # 7:00 PM IST, Monday to Friday (13:30 UTC)
    - cron: "30 13 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select tracker operation"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
          - rebuild

permissions:
  contents: read

concurrency:
  group: nifty50-pe-tracker
  cancel-in-progress: false

jobs:
  fetch-and-upsert:
    name: Fetch & upsert Nifty 50 P/E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python setup
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      # --------------------------------------------------
      # 4. Verify script and implementation
      # --------------------------------------------------
      - name: Verify tracker script
        run: |
          echo "=========================================="
          echo "TRACKER SCRIPT VERIFICATION"
          echo "=========================================="

          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo "Python file: $(realpath sync_nifty_pe.py)"

          if [ ! -f "sync_nifty_pe.py" ]; then
            echo "::error::sync_nifty_pe.py not found"
            exit 1
          fi

          python -m py_compile sync_nifty_pe.py

          echo "Python syntax check passed."

          if grep -q "Warming up NSE session" sync_nifty_pe.py; then
            echo "::error::Old NSE implementation detected"
            exit 1
          fi

          if grep -q "fetch_nse_live_pe" sync_nifty_pe.py; then
            echo "::error::Old NSE live-fetch function detected"
            exit 1
          fi

          if ! grep -q "Nifty Indices historical data" sync_nifty_pe.py; then
            echo "::error::Expected Nifty Indices implementation not found"
            exit 1
          fi

          echo "New implementation verified."

      # --------------------------------------------------
      # 5. Verify Supabase configuration
      # --------------------------------------------------
      - name: Diagnose tracker configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "=========================================="
          echo "SUPABASE CONFIGURATION CHECK"
          echo "=========================================="

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_KEY is missing"
            exit 1
          fi

          echo "Supabase URL configured."
          echo "Supabase API key configured."
          echo "API key length: ${#SUPABASE_KEY}"

          case "$SUPABASE_KEY" in
            sb_secret_*)
              echo "New Supabase Secret API Key detected."
              ;;
            *)
              echo "::error::Expected a Supabase sb_secret_ API key."
              exit 1
              ;;
          esac

      # --------------------------------------------------
      # 6. Run tracker
      # --------------------------------------------------
      - name: Run Nifty 50 P/E tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ inputs.mode || 'daily' }}"

          echo "=========================================="
          echo "NIFTY 50 P/E TRACKER"
          echo "=========================================="

          echo "Mode: $MODE"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Python file: $(realpath sync_nifty_pe.py)"

          python sync_nifty_pe.py "$MODE"

      # --------------------------------------------------
      # 7. Success report
      # --------------------------------------------------
      - name: Report completion
        if: success()
        run: |
          echo "=========================================="
          echo "NIFTY 50 P/E TRACKER COMPLETED"
          echo "=========================================="

      # --------------------------------------------------
      # 8. Failure report
      # --------------------------------------------------
      - name: Report failure
        if: failure()
        run: |
          echo "::error::Nifty 50 P/E tracker failed. Check the preceding logs."
