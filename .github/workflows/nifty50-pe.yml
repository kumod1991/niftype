```yaml
name: Fetch & Upsert Nifty 50 P/E

on:
  schedule:
    # 7:00 PM IST, Monday to Friday
    - cron: "30 13 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select tracker operation"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
          - rebuild

permissions:
  contents: read

concurrency:
  group: nifty50-pe-tracker
  cancel-in-progress: false

jobs:
  fetch-and-upsert:
    name: Fetch & upsert Nifty 50 P/E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Verify Python script
        run: |
          echo "Checking sync_nifty_pe.py"

          if [ ! -f "sync_nifty_pe.py" ]; then
            echo "::error::sync_nifty_pe.py not found"
            exit 1
          fi

          python -m py_compile sync_nifty_pe.py

          echo "Python syntax check passed."

      - name: Diagnose tracker configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_KEY is missing"
            exit 1
          fi

          echo "Supabase URL configured"
          echo "Supabase API key configured"

          if grep -q "fetch_nse_live_pe" sync_nifty_pe.py; then
            echo "::error::Old NSE live-fetch function found"
            exit 1
          fi

          if grep -q "Warming up NSE session" sync_nifty_pe.py; then
            echo "::error::Old NSE implementation found"
            exit 1
          fi

          echo "New daily implementation verified."

      - name: Run Nifty 50 P/E tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ inputs.mode || 'daily' }}"

          echo "=========================================="
          echo "NIFTY 50 P/E TRACKER"
          echo "Mode: $MODE"
          echo "=========================================="

          python sync_nifty_pe.py "$MODE"

      - name: Report completion
        if: success()
        run: |
          echo "Nifty 50 P/E tracker completed successfully."

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Nifty 50 P/E tracker failed. Check the logs."
```
