name: Nifty 50 Monthly P/E Update

on:
  # Scheduled trigger: 1st of every month at 06:00 UTC (11:30 IST)
  schedule:
    - cron: "0 6 1 * *"

  # Manual trigger for backfill / debugging
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip DB write)"
        required: false
        default: "false"
        type: boolean

jobs:

  # ==========================================================================
  # FETCH AND STORE
  # ==========================================================================

  fetch-and-store:
    name: Fetch Nifty 50 P/E & Upsert to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required for:
    # 1. Checkout repository
    # 2. Create GitHub Issue if the workflow fails
    permissions:
      contents: read
      issues: write

    steps:

      # ----------------------------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. Set up Python
      # ----------------------------------------------------------------------

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ----------------------------------------------------------------------
      # 3. Install dependencies
      # ----------------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------------------
      # 4. Run Nifty 50 P/E fetch + Supabase upsert
      # ----------------------------------------------------------------------

      - name: Fetch & upsert Nifty 50 P/E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

        run: |
          python fetch_nifty_pe.py

      # ----------------------------------------------------------------------
      # 5. Create GitHub Issue if the fetch job fails
      # ----------------------------------------------------------------------

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const date =
              new Date().toISOString().slice(0, 10);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,

              title:
                `[Alert] Nifty 50 P/E fetch failed — ${date}`,

              body:
                `## Nifty 50 P/E Pipeline Failure\n\n` +
                `The monthly Nifty 50 P/E fetch workflow failed.\n\n` +
                `**Workflow:** ${context.workflow}\n\n` +
                `**Repository:** ${context.repo.owner}/${context.repo.repo}\n\n` +
                `**Run:** ${runUrl}\n\n` +
                `**Commit:** ${context.sha}\n\n` +
                `Please check the workflow logs for the underlying error.`
            });
