name: Nifty 50 Daily and Monthly PE Tracker

on:
  schedule:
    # 19:00 IST, Monday to Friday
    - cron: "30 13 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Select tracker operation"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
          - rebuild

permissions:
  contents: read

concurrency:
  group: nifty50-pe-tracker
  cancel-in-progress: false

jobs:
  update-nifty-pe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Run Nifty PE tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ inputs.mode || 'daily' }}"
          echo "Running tracker in $MODE mode"
          python sync_nifty_pe.py "$MODE"
